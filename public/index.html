<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Running Journal</title>
  <meta name="description" content="บันทึกการวิ่งและแผนซ้อมสู่ Half Marathon" />
  <meta name="theme-color" content="#090d1a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#050b24" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Run Journal" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600&family=Kanit:wght@600&family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22c4-1 6-4 8-8s5-7 12-8" /><circle cx="26" cy="6" r="2.4" /></svg>
      </span>
      <span class="brand-text">Running Journal<small>Road to 21.1</small></span>
    </a>
    <nav class="tabs" aria-label="เมนูหลัก">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>วันนี้</span></a>
      <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>แผน</span></a>
      <a href="#/runs" data-tab="runs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17V8.5l4 1.5 2.5-2 1.5 3.5 6 2.5c2 .8 4 1.6 4 3.5V17z"/><path d="M3 17v2h19v-2"/></svg><span>วิ่ง</span></a>
      <a href="#/strength" data-tab="strength"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg><span>เวท</span></a>
      <a href="#/health" data-tab="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M7.5 11.5h2.5l1.2-2.2 1.8 4.2 1.2-2h2.3"/></svg><span>ร่างกาย</span></a>
    </nav>
    <div class="top-actions">
      <a class="top-pill" href="#/notes" data-tab="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12H9l-4 4z"/><path d="M9 9h6M9 12h4"/></svg><span>โค้ช</span></a>
      <a class="gear" href="#/settings" data-tab="settings" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></a>
    </div>
  </header>
  <main id="app" aria-live="polite">
    <div class="loading"><span></span><span></span><span></span></div>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
